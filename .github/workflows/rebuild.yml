name: Publicar sitio

# Tres formas de disparar la publicacion en Cloudflare Pages:
#
#  1. push a main      -> publica los cambios de codigo al toque.
#  2. cada 6 horas     -> refresca los feeds de YouTube, Substack y Spotify,
#                         que se leen en tiempo de build.
#  3. a mano           -> boton "Run workflow" en la pestana Actions de GitHub.
#
# OJO: GitHub deshabilita solo los workflows programados cuando el repositorio
# pasa 60 dias sin actividad (paso el 7 de julio de 2026). Si vuelve a pasar,
# llega un mail de aviso y se reactiva con:  gh workflow enable "Publicar sitio"

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

# Si entran dos disparos juntos, que no compitan por cual queda de ultimo.
concurrency:
  group: publicar-sitio
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el deploy hook de Cloudflare Pages
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secreto CF_DEPLOY_HOOK_URL. Cargalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Deploy hook disparado. Cloudflare compila y publica en 1-3 minutos."
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
